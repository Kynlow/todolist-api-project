<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todolist</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <article>
        <button>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            height="24px"
            width="24px"
            fill="#e3e3e3"
          >
            <path d="M12,15.4l-6-6L7.4,8L12,12.6L16.6,8L18,9.4l-6,6Z" />
          </svg>
        </button>
        <input
          type="text"
          placeholder="Quoi de prévu aujourd'hui ?"
          id="userText"
        />
      </article>
      <ul id="listContainer">
        <li class="listContainer-li">
          <label for="checkboxX"
            >Test
            <input type="checkbox" name="checkbox" id="checkboxX" />
          </label>
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              height="24px"
              width="24px"
              fill="#e3e3e3"
            >
              <path
                d="M6.4,19L5,17.6L10.6,12L5,6.4L6.4,5L12,10.6L17.6,5L19,6.4L13.4,12L19,17.6L17.6,19L12,13.4L6.4,19Z"
              />
            </svg>
          </button>
        </li>
      </ul>
    </section>
    <script src="app.js"></script>
  </body>
</html>
